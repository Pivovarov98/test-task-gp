databaseChangeLog:
  - changeSet:
      id: 001-create-hotel
      author: egor

      changes:

        - createTable:
            tableName: hotel
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false

              - column:
                  name: brand
                  type: VARCHAR(50)

              - column:
                  name: country
                  type: VARCHAR(255)

              - column:
                  name: city
                  type: VARCHAR(255)

              - column:
                  name: street
                  type: VARCHAR(255)

              - column:
                  name: postcode
                  type: INT

              - column:
                  name: check_in
                  type: TIME

              - column:
                  name: check_out
                  type: TIME

        - createTable:
            tableName: hotel_amenities
            columns:
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: amenity
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: hotel_amenities
            columnNames: hotel_id, amenity
            constraintName: pk_hotel_amenities

        - addForeignKeyConstraint:
            baseTableName: hotel_amenities
            baseColumnNames: hotel_id
            referencedTableName: hotel
            referencedColumnNames: id
            constraintName: fk_hotel_amenities