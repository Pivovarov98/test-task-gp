databaseChangeLog:
  - changeSet:
      id: 2
      author: egor
      changes:
        - createTable:
            tableName: hotel_amenities
            columns:
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: amenities
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: amenity_order
                  type: INT
                  constraints:
                    nullable: false